<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Approval Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container py-5">

<div class="card shadow-lg p-4">

<h2 class="text-center mb-4">

Loan Approval Prediction System

</h2>

<form action="/predict" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Gender</label>

<select class="form-select" name="Gender">

<option>Male</option>

<option>Female</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Married</label>

<select class="form-select" name="Married">

<option>Yes</option>

<option>No</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Dependents</label>

<input class="form-control" type="number" min="0" max="5" name="Dependents" required>

</div>

<div class="col-md-6 mb-3">

<label>Education</label>

<select class="form-select" name="Education">

<option>Graduate</option>

<option>Not Graduate</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Self Employed</label>

<select class="form-select" name="Self_Employed">

<option>No</option>

<option>Yes</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Applicant Income</label>

<input class="form-control" type="number" min="0" name="ApplicantIncome" required>

</div>

<div class="col-md-6 mb-3">

<label>Coapplicant Income</label>

<input class="form-control" type="number" min="0" name="CoapplicantIncome" required>

</div>

<div class="col-md-6 mb-3">

<label>Loan Amount</label>

<input class="form-control" type="number" min="1" name="LoanAmount" required>

</div>

<div class="col-md-6 mb-3">

<label>Loan Term</label>

<input class="form-control" type="number" min="1" name="Loan_Amount_Term" required>

</div>

<div class="col-md-6 mb-3">

<label>Credit History</label>

<select class="form-select" name="Credit_History">

<option value="1">Good</option>

<option value="0">Bad</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Property Area</label>

<select class="form-select" name="Property_Area">

<option>Urban</option>

<option>Semiurban</option>

<option>Rural</option>

</select>

</div>

</div>

<button class="btn btn-primary w-100 mt-3">

Predict Loan Status

</button>

</form>

{% if prediction %}

<div class="alert alert-info text-center mt-4">

<h3>{{ prediction }}</h3>

<h5>Approval Probability : {{ probability }}%</h5>

</div>

{% endif %}

</div>

</div>

</body>

</html>
<hr class="my-5">

<h2 class="text-center mb-4">
Model Performance Dashboard
</h2>

<div class="row">

<div class="col-md-4">

<div class="card p-2 shadow">

<h5 class="text-center">
Feature Importance
</h5>

<img src="{{ url_for('static', filename='feature_importance.png') }}"
class="img-fluid">

</div>

</div>

<div class="col-md-4">

<div class="card p-2 shadow">

<h5 class="text-center">
Confusion Matrix
</h5>

<img src="{{ url_for('static', filename='confusion_matrix.png') }}"
class="img-fluid">

</div>

</div>

<div class="col-md-4">

<div class="card p-2 shadow">

<h5 class="text-center">
ROC Curve
</h5>

<img src="{{ url_for('static', filename='roc_curve.png') }}"
class="img-fluid">

</div>

</div>

</div>
